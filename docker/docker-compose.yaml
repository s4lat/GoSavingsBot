services:
  postgres:
    image: bitnami/postgresql:16.4.0
    environment:
      - 'POSTGRESQL_USERNAME=postgres'
      - 'POSTGRESQL_PASSWORD=postgres'
      - 'POSTGRESQL_DATABASE=postgres'
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d recsys_dev" ]
      interval: 5s
      timeout: 10s
      retries: 30

  goose:
    image: artsafin/goose-migrations:latest
    volumes:
      - ../migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: postgres "host=postgres port=5432 user=postgres password=postgres dbname=postgres sslmode=disable" up
